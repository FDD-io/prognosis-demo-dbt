version: 2

models:
  - name: engagement_features
    description: "Feature table feeding downstream machine learning recommendation models with customer engagement metrics and regional signals."
    columns:
      - name: customer_id
        description: "Unique identifier for each customer record."
        data_tests:
          - unique
          - not_null
      - name: user_region
        description: "Geographic region signal passed down from staging for regional segmentation in ML recommendations."
        data_tests:
          - not_null
      - name: engagement_score
        description: "Calculated engagement score used as a key feature input for recommendation models."
        data_tests:
          - not_null
      - name: account_age_days
        description: "Customer account tenure in days."
